[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-energy-coopt"
version = "1.0.0"
description = "Household water-supply technology MILP behind Jones et al. (2021), Sustainable Cities and Society"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [{name = "Erick C. Jones, Jr.", email = "erick.jones@uta.edu"}]
dependencies = [
    "gurobipy>=11,<14",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
